[platformio]
default_envs = esp32c3

[env]
platform = platformio/espressif32 @ 7.0.0
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
    crankyoldgit/IRremoteESP8266 @ 2.9.0
    bblanchon/ArduinoJson @ 7.4.3
build_flags =
    -D IR_DEFAULT_FREQUENCY=38000
    -D DEVICE_HOSTNAME=\"tv-remote\"
    -D FIRMWARE_VERSION=\"1.5.4\"

[env:esp32c3]
board = seeed_xiao_esp32c3
build_flags =
    ${env.build_flags}
    -D IR_TX_PIN=10
    -D IR_RX_PIN=3
    -D IR_ENABLE_RX=0

[env:esp32c3_ota]
extends = env:esp32c3
upload_protocol = espota

[env:esp32dev]
board = esp32dev
build_flags =
    ${env.build_flags}
    -D IR_TX_PIN=18
    -D IR_RX_PIN=27
    -D IR_ENABLE_RX=1
